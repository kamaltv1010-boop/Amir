<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0A2E"/>
      <stop offset="0.55" stop-color="#2A1FB8"/>
      <stop offset="1" stop-color="#7A2CF2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.49" r="0.5">
      <stop offset="0" stop-color="#FFB36B" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FF7A59" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD8FF"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="0.5" stop-color="#FF8A4C"/>
      <stop offset="1" stop-color="#F2457A"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#05041A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="500" r="470" fill="url(#glow)"/>
  <!-- faint orbit -->
  <ellipse cx="512" cy="512" rx="400" ry="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="10" transform="rotate(-28 512 512)"/>
  <!-- shield -->
  <path filter="url(#shadow)" fill="url(#shield)"
        d="M512 168 C 604 232 702 258 800 262 C 800 528 722 718 512 852 C 302 718 224 528 224 262 C 322 258 420 232 512 168 Z"/>
  <!-- light: a four-point star -->
  <path fill="url(#light)" filter="url(#blur)" opacity="0.6"
        d="M512 330 Q 534 474 676 500 Q 534 526 512 670 Q 490 526 348 500 Q 490 474 512 330 Z"/>
  <path fill="url(#light)"
        d="M512 330 Q 534 474 676 500 Q 534 526 512 670 Q 490 526 348 500 Q 490 474 512 330 Z"/>
  <circle cx="512" cy="500" r="22" fill="#FFF6E8"/>
</svg>
