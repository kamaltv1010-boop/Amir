# Builds an unsigned AmirBrowser.ipa on a macOS runner. Download it from the
# run's "Artifacts" section and install it with Sideloadly or AltStore, which
# sign it with your own Apple ID (see README.md).
name: Build IPA

on:
  push:
    paths:
      - "AmirBrowser/**"
      - "AmirBrowser.xcodeproj/**"
      - "Support/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AmirBrowser.xcodeproj \
            -scheme AmirBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # A delegate method whose signature doesn't exactly match the SDK compiles
      # with only a "nearly matches" warning, but WebKit never calls it.
      - name: Check delegate signatures
        run: |
          if grep -n "nearly matches" build.log; then
            echo "::error::A WebKit delegate method does not match the SDK signature"
            exit 1
          fi

      # The build succeeds even when a language or a permission text is
      # missing from the app, so check the bundle itself.
      - name: Check app bundle
        run: |
          app=build/Build/Products/Release-iphoneos/AmirBrowser.app
          plutil -p "$app/Info.plist"
          for lang in en ar fr; do
            for table in Localizable InfoPlist; do
              file="$app/$lang.lproj/$table.strings"
              if [ ! -f "$file" ]; then
                echo "::error::Missing $lang.lproj/$table.strings"
                exit 1
              fi
            done
          done
          plutil -p "$app/ar.lproj/InfoPlist.strings"

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AmirBrowser.app Payload/
          zip -qry AmirBrowser.ipa Payload

      - uses: actions/upload-artifact@v6
        with:
          name: AmirBrowser-ipa
          path: AmirBrowser.ipa
          if-no-files-found: error
