# جلسة محاكي Android مؤقتة لدراسة لعبة Magic Sort (بحث فقط، تُحذف بعد الانتهاء). المحاولة 2: مع سجلات النظام.
# تشتغل فقط عند تعديل هذا الملف على فرع claude/quirky-ride-r4oor0.
# التحكم: research/emu/cmd.txt (أوامر نقر) ← والنتائج: research/emu/out (لقطات شاشة).
name: emu-session (بحث مؤقت)

on:
  push:
    branches: [claude/quirky-ride-r4oor0]
    paths: [".github/workflows/emu-session.yml"]

permissions:
  contents: write

concurrency:
  group: emu-session
  cancel-in-progress: true

jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quirky-ride-r4oor0
          fetch-depth: 1

      - name: تفعيل KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: تحميل اللعبة (XAPK)
        run: |
          pip install -q pillow
          curl -sSL --retry 3 -A "Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36" \
            -o /tmp/game.xapk "https://d.apkpure.net/b/XAPK/com.grandgames.magicsort?version=latest"
          mkdir -p /tmp/game && cd /tmp/game && unzip -q /tmp/game.xapk && ls -la

      - name: تشغيل المحاكي وحلقة التحكم
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: google_apis
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash research/emu/loop.sh
